{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devsupersuite.fullname" . | default "devsupersuite" }}-zero-egress
  labels:
    app.kubernetes.io/name: devsupersuite
    app.kubernetes.io/instance: {{ .Release.Name }}
    devsupersuite.com/policy: airgap-zero-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devsupersuite
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Intra-namespace internal service communication
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.httpsPort }}
        - protocol: TCP
          port: {{ .Values.service.httpPort }}
    # 2. Private corporate enterprise network CIDRs
    {{- range .Values.networkPolicy.allowedIngressCIDRs }}
    - from:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.httpsPort }}
        - protocol: TCP
          port: {{ $.Values.service.httpPort }}
    {{- end }}
  egress:
    # 1. Intra-namespace communication only
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.httpsPort }}
        - protocol: TCP
          port: {{ .Values.service.httpPort }}
    # 2. In-cluster CoreDNS resolution in kube-system (Internal DNS only)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # ALL OTHER OUTBOUND EGRESS IS MATHEMATICALLY REJECTED (Zero Public Internet)
{{- end }}
