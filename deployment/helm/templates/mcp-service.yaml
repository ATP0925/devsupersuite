apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp-proxy
  labels:
    app.kubernetes.io/name: mcp-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.mcpProxy.service.type }}
  ports:
    - port: {{ .Values.mcpProxy.service.port }}
      targetPort: 9090
      protocol: TCP
      name: jsonrpc
  selector:
    app.kubernetes.io/name: mcp-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}

