# DevSuperSuite Tech Services - Secrets Store CSI Driver SecretProviderClass
# Automated Secret Rotation, Dynamic Mounts, and Kubernetes Secret Generation
# Contact: DevSuperSuite Solutions Architecture (solutions@devsupersuite.com)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: devsupersuite-vault-secrets
  namespace: devsupersuite-system
  labels:
    app.kubernetes.io/name: devsupersuite-ast-proxy
    app.kubernetes.io/part-of: devsupersuite-secrets
    app.kubernetes.io/managed-by: devsupersuite-vault-manager
spec:
  provider: vault
  parameters:
    vaultAddress: https://vault.internal.devsupersuite.io:8200
    roleName: devsupersuite-ast-proxy-role
    vaultKubernetesMountPath: kubernetes
    objects: "- objectName: \"tree-sitter-signing-key\"\n  secretPath: \"secret/data/devsupersuite/signing\"\
      \n  secretKey: \"private_key\"\n- objectName: \"shannon-entropy-salt\"\n  secretPath:\
      \ \"secret/data/devsupersuite/security\"\n  secretKey: \"salt\"\n- objectName:\
      \ \"db-credentials\"\n  secretPath: \"secret/data/devsupersuite/database\"\n\
      \  secretKey: \"password\"\n"
  secretObjects:
  - secretName: devsupersuite-runtime-secrets
    type: Opaque
    labels:
      environment: production-scif
      security.devsupersuite.io/zero-disk: 'true'
    data:
    - objectName: tree-sitter-signing-key
      key: SIGNING_KEY
    - objectName: shannon-entropy-salt
      key: ENTROPY_SALT
    - objectName: db-credentials
      key: DB_PASSWORD
