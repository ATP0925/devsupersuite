# ═══════════════════════════════════════════════════════════════════════════════
# DevSuperSuite Tech Services - Vault Agent Injector & RAM tmpfs Mounts
# Zero Disk Persistence (emptyDir: Memory) & FIPS 140-3 Hardware Key Lifecycle
# Contact: DevSuperSuite Solutions Architecture (solutions@devsupersuite.com)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsupersuite-ast-proxy
  namespace: devsupersuite-system
  labels:
    app.kubernetes.io/name: devsupersuite-ast-proxy
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: devsupersuite-ast-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devsupersuite-ast-proxy
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/role: devsupersuite-ast-proxy-role
        vault.hashicorp.com/agent-inject-status: update
        vault.hashicorp.com/agent-limits-cpu: 250m
        vault.hashicorp.com/agent-limits-mem: 128Mi
        vault.hashicorp.com/agent-inject-secret-signing: secret/data/devsupersuite/signing
        vault.hashicorp.com/secret-volume-path-signing: /vault/secrets/ram
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
    spec:
      serviceAccountName: devsupersuite-vault-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
      - name: vault-secrets-tmpfs
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: csi-secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: devsupersuite-vault-secrets
      containers:
      - name: ast-proxy
        image: registry.devsupersuite.io/enterprise/ast-proxy:v2026.3.0
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: vault-secrets-tmpfs
          mountPath: /vault/secrets/ram
          readOnly: false
        - name: csi-secrets-store
          mountPath: /mnt/secrets-store
          readOnly: true
