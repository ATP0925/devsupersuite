# ═══════════════════════════════════════════════════════════════════════════════
# DevSuperSuite Tech Services - Operator Controller Manager Deployment
# HA Leader Election, Hardened Pod SecurityContext (UID 10001)
# Contact: DevSuperSuite Platform Engineering (solutions@devsupersuite.com)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsupersuite-operator-controller-manager
  namespace: devsupersuite-system
  labels:
    app.kubernetes.io/name: devsupersuite-operator
    app.kubernetes.io/component: controller-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devsupersuite-operator
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devsupersuite-operator
        app.kubernetes.io/component: controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
    spec:
      serviceAccountName: devsupersuite-operator-controller-manager
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: manager
        image: registry.devsupersuite.io/enterprise/k8s-operator:v2026.3.0
        imagePullPolicy: IfNotPresent
        command:
        - /manager
        args:
        - --leader-elect=true
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --zap-log-level=info
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
