# ═══════════════════════════════════════════════════════════════════════════════
# DevSuperSuite Tech Services - Operator RBAC Least-Privilege Manifests
# ServiceAccount, ClusterRole, and ClusterRoleBinding (No Wildcard Verbs)
# Contact: DevSuperSuite Platform Engineering (solutions@devsupersuite.com)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsupersuite-operator-controller-manager
  namespace: devsupersuite-system
  labels:
    app.kubernetes.io/name: devsupersuite-operator
    app.kubernetes.io/component: controller-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devsupersuite-operator-manager-role
  labels:
    app.kubernetes.io/name: devsupersuite-operator
rules:
- apiGroups:
  - operator.devsupersuite.io
  resources:
  - devsupersuiteclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operator.devsupersuite.io
  resources:
  - devsupersuiteclusters/status
  - devsupersuiteclusters/finalizers
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ''
  resources:
  - services
  - configmaps
  - secrets
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ''
  resources:
  - pods
  - events
  verbs:
  - get
  - list
  - watch
  - create
  - patch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devsupersuite-operator-manager-rolebinding
  labels:
    app.kubernetes.io/name: devsupersuite-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devsupersuite-operator-manager-role
subjects:
- kind: ServiceAccount
  name: devsupersuite-operator-controller-manager
  namespace: devsupersuite-system
